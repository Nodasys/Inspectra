<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspectra</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 300px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #2d2d30;
            padding: 15px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #007acc;
        }

        .version {
            font-size: 12px;
            color: #858585;
        }

        .section {
            padding: 15px;
            border-bottom: 1px solid #3e3e42;
        }

        .section h2 {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .process-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .process-item {
            padding: 10px;
            margin-bottom: 5px;
            background: #2d2d30;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .process-item:hover {
            background: #37373d;
        }

        .process-item.selected {
            background: #094771;
            border-left: 3px solid #007acc;
        }

        .process-name {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .process-details {
            font-size: 12px;
            color: #858585;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .scan-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        input, select, button {
            padding: 8px 12px;
            border: 1px solid #3e3e42;
            background: #2d2d30;
            color: #d4d4d4;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #007acc;
        }

        button {
            background: #007acc;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            border: none;
        }

        button:hover {
            background: #005a9e;
        }

        button:disabled {
            background: #3e3e42;
            cursor: not-allowed;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: #2d2d30;
            border-radius: 4px;
            overflow: hidden;
        }

        .results-table th,
        .results-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #3e3e42;
        }

        .results-table th {
            background: #1e1e1e;
            font-weight: 600;
            color: #cccccc;
            text-transform: uppercase;
            font-size: 12px;
        }

        .results-table tr:hover {
            background: #37373d;
        }

        .status-bar {
            background: #007acc;
            color: white;
            padding: 8px 20px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        .search-box {
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
        }

        .btn-refresh {
            width: 100%;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #858585;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3e3e42;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4e4e52;
        }

        .loader {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #3e3e42;
            border-top-color: #007acc;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="section">
                <h2>Process List</h2>
                <div class="search-box">
                    <input type="text" id="searchProcess" placeholder="Search processes...">
                </div>
                <button class="btn-refresh" onclick="loadProcesses()">🔄 Refresh Processes</button>
            </div>
            <div class="process-list" id="processList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M11,8V14H13V8H11M11,16V18H13V16H11Z" />
                    </svg>
                    <p>Click "Refresh Processes" to load</p>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>🔍 Inspectra</h1>
                <span class="version" id="version">v0.1.0</span>
            </div>

            <div class="content-area">
                <div class="section">
                    <h2>Memory Scanner</h2>
                    <div class="scan-controls">
                        <select id="dataType">
                            <option value="i32">Int32</option>
                            <option value="i64">Int64</option>
                            <option value="f32">Float32</option>
                            <option value="f64">Float64</option>
                            <option value="string">String</option>
                        </select>
                        <input type="text" id="scanValue" placeholder="Enter value to scan..." style="flex: 1;">
                        <button onclick="scanMemory()" id="btnScan" disabled>🔎 Scan Memory</button>
                    </div>
                </div>

                <div class="section" id="resultsSection" style="display: none;">
                    <h2>Scan Results <span id="resultCount"></span></h2>
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Address</th>
                                <th>Value</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                        </tbody>
                    </table>
                </div>

                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
                    </svg>
                    <h3>Ready to Scan</h3>
                    <p>Select a process and enter a value to scan</p>
                </div>
            </div>

            <div class="status-bar">
                <span id="statusText">Ready</span>
                <span id="attachedProcess">No process attached</span>
            </div>
        </div>
    </div>

    <script>
        let invoke;
        // Robust helper: wait until Tauri is injected and pick the correct invoke location
        async function getInvoke(timeoutMs = 5000) {
            if (invoke) return invoke;
            const started = Date.now();
            while (Date.now() - started < timeoutMs) {
                const tauri = window.__TAURI__;
                const candidate = tauri?.invoke || tauri?.tauri?.invoke || tauri?.core?.invoke;
                if (typeof candidate === 'function') {
                    invoke = candidate;
                    return invoke;
                }
                // wait 50ms and try again
                await new Promise(r => setTimeout(r, 50));
            }
            throw new Error('Tauri not initialized');
        }
        let currentPid = null;
        let allProcesses = [];

        // Wait for Tauri API to be ready
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await getInvoke();
                await loadVersion();
                updateStatus('Ready');
            } catch (e) {
                console.error(e);
                updateStatus('Error: Tauri not initialized', false);
            }
            // Note: Don't auto-load processes; user will click Refresh
        });

        async function loadVersion() {
            try {
                const ivk = await getInvoke();
                const version = await ivk('get_version');
                document.getElementById('version').textContent = version;
            } catch (error) {
                console.error('Failed to load version:', error);
                document.getElementById('version').textContent = 'v0.1.0';
            }
        }

        async function loadProcesses() {
            try {
                updateStatus('Loading processes...', true);
                const ivk = await getInvoke();
                const processes = await ivk('list_processes');
                allProcesses = processes;
                displayProcesses(processes);
                updateStatus(`Loaded ${processes.length} processes`);
            } catch (error) {
                updateStatus('Error: ' + error, false);
                console.error('Failed to load processes:', error);
            }
        }

        function displayProcesses(processes) {
            const processList = document.getElementById('processList');
            processList.innerHTML = '';

            processes.forEach(proc => {
                const item = document.createElement('div');
                item.className = 'process-item';
                if (proc.pid === currentPid) {
                    item.classList.add('selected');
                }
                item.innerHTML = `
                    <div class="process-name">${proc.name}</div>
                    <div class="process-details">PID: ${proc.pid} | ${proc.architecture}</div>
                `;
                item.onclick = () => attachToProcess(proc.pid, proc.name);
                processList.appendChild(item);
            });
        }

        async function attachToProcess(pid, name) {
            try {
                updateStatus(`Attaching to ${name} (${pid})...`, true);
                const ivk = await getInvoke();
                const result = await ivk('attach_process', { pid });
                currentPid = pid;
                document.getElementById('attachedProcess').textContent = `Attached: ${name} (${pid})`;
                document.getElementById('btnScan').disabled = false;
                updateStatus(result);
                
                // Update UI
                displayProcesses(allProcesses);
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('resultsSection').style.display = 'none';
            } catch (error) {
                updateStatus('Error: ' + error, false);
                console.error('Failed to attach:', error);
            }
        }

        async function scanMemory() {
            const value = document.getElementById('scanValue').value;
            const dataType = document.getElementById('dataType').value;

            if (!value) {
                updateStatus('Please enter a value to scan', false);
                return;
            }

            if (!currentPid) {
                updateStatus('Please attach to a process first', false);
                return;
            }

            try {
                updateStatus('Scanning memory...', true);
                const ivk = await getInvoke();
                const results = await ivk('scan_memory', { 
                    value,
                    dataType 
                });

                displayResults(results);
                updateStatus(`Found ${results.length} results`);
            } catch (error) {
                updateStatus('Error: ' + error, false);
                console.error('Scan failed:', error);
            }
        }

        function displayResults(results) {
            const resultsBody = document.getElementById('resultsBody');
            const resultsSection = document.getElementById('resultsSection');
            const emptyState = document.getElementById('emptyState');
            const resultCount = document.getElementById('resultCount');

            resultsBody.innerHTML = '';

            if (results.length === 0) {
                emptyState.style.display = 'block';
                resultsSection.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            resultsSection.style.display = 'block';
            resultCount.textContent = `(${results.length} results)`;

            results.forEach(result => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><code>${result.address}</code></td>
                    <td>${result.value}</td>
                    <td>
                        <button onclick="copyAddress('${result.address}')" style="padding: 4px 8px; font-size: 12px;">📋 Copy</button>
                    </td>
                `;
                resultsBody.appendChild(row);
            });
        }

        function copyAddress(address) {
            navigator.clipboard.writeText(address);
            updateStatus(`Copied ${address} to clipboard`);
        }

        function updateStatus(text, loading = false) {
            const statusText = document.getElementById('statusText');
            statusText.innerHTML = loading ? `<span class="loader"></span> ${text}` : text;
        }

        // Search filter - wait for DOM to be ready
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchProcess').addEventListener('input', (e) => {
                const search = e.target.value.toLowerCase();
                const filtered = allProcesses.filter(p => 
                    p.name.toLowerCase().includes(search) || 
                    p.pid.toString().includes(search)
                );
                displayProcesses(filtered);
            });
        });
    </script>
</body>
</html>
