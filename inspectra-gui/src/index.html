<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspectra</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #d4d4d4; overflow: hidden; user-select: none; }

.main-container { display: flex; flex-direction: column; height: 100vh; }

.top-bar { background: #2d2d30; border-bottom: 1px solid #3e3e42; padding: 8px 12px; display: flex; align-items: center; gap: 12px; }
.process-display { flex: 1; display: flex; align-items: center; gap: 8px; background: #1e1e1e; padding: 6px 12px; border-radius: 4px; border: 1px solid #3e3e42; }
.process-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.process-icon img { width: 24px; height: 24px; object-fit: contain; }
.process-name { font-weight: 600; font-size: 14px; }
.process-pid { font-size: 11px; color: #858585; margin-left: 8px; }
.btn-select-process { background: #0e639c; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; }
.btn-select-process:hover { background: #1177bb; }

.content { display: grid; grid-template-columns: 350px 1fr; grid-template-rows: 1fr 280px; height: calc(100vh - 90px); gap: 1px; background: #1a1a1a; }

.panel { background: #252526; display: flex; flex-direction: column; overflow: hidden; }
.panel-header { background: #2d2d30; padding: 10px 12px; border-bottom: 1px solid #3e3e42; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.panel-content { flex: 1; overflow: auto; padding: 12px; }

.scan-controls { grid-row: 1; }
.control-group { margin-bottom: 16px; }
.control-label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 6px; color: #cccccc; text-transform: uppercase; letter-spacing: 0.3px; }
input[type="text"], input[type="number"], select { width: 100%; background: #1e1e1e; color: #d4d4d4; border: 1px solid #3e3e42; border-radius: 3px; padding: 8px 10px; font-size: 13px; font-family: 'Consolas', 'Courier New', monospace; }
input:focus, select:focus { outline: none; border-color: #0e639c; }
.input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.btn { width: 100%; padding: 10px; border: none; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: #0e639c; color: white; }
.btn-primary:hover:not(:disabled) { background: #1177bb; }
.btn-primary:disabled { background: #3e3e42; color: #6e6e6e; cursor: not-allowed; }
.btn-secondary { background: #3e3e42; color: #d4d4d4; }
.btn-secondary:hover:not(:disabled) { background: #4e4e52; }
.btn-danger { background: #c72e2e; color: white; }
.btn-danger:hover { background: #d74242; }

.results-panel { grid-column: 2; grid-row: 1; }
.results-toolbar { display: flex; gap: 8px; padding: 8px 12px; background: #2d2d30; border-bottom: 1px solid #3e3e42; }
.results-toolbar input { flex: 1; margin: 0; }
.results-toolbar button { padding: 6px 14px; background: #3e3e42; border: none; color: #d4d4d4; border-radius: 3px; cursor: pointer; font-size: 12px; }
.results-toolbar button:hover { background: #4e4e52; }

table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { position: sticky; top: 0; background: #2d2d30; text-align: left; padding: 10px 12px; border-bottom: 1px solid #3e3e42; color: #cccccc; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
td { padding: 8px 12px; border-bottom: 1px solid #2d2d30; }
tr:hover { background: #2d2d30; }
td input { width: 100%; margin: 0; padding: 4px 6px; font-size: 12px; }
td input[type="checkbox"] { width: auto; cursor: pointer; }
code { font-family: 'Consolas', 'Courier New', monospace; color: #4ec9b0; font-size: 11px; }

.address-list { grid-column: 1 / 3; grid-row: 2; }

.status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #007acc; color: white; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; z-index: 1000; }
.status-text { flex: 1; }
.status-version { opacity: 0.8; }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 2000; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: #252526; border: 1px solid #3e3e42; border-radius: 6px; width: 800px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
.modal-header { background: #2d2d30; padding: 14px 16px; border-bottom: 1px solid #3e3e42; display: flex; justify-content: space-between; align-items: center; }
.modal-title { font-size: 14px; font-weight: 600; }
.modal-close { background: none; border: none; color: #d4d4d4; font-size: 20px; cursor: pointer; padding: 0; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 3px; }
.modal-close:hover { background: #3e3e42; }
.modal-tabs { display: flex; background: #2d2d30; border-bottom: 1px solid #3e3e42; }
.modal-tab { padding: 10px 20px; border: none; background: none; color: #858585; cursor: pointer; font-size: 12px; font-weight: 600; border-bottom: 2px solid transparent; }
.modal-tab.active { color: #d4d4d4; border-bottom-color: #007acc; }
.modal-search { padding: 12px 16px; border-bottom: 1px solid #3e3e42; }
.modal-search input { width: 100%; margin: 0; }
.modal-content { flex: 1; overflow: auto; padding: 0; }
.process-list-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #2d2d30; }
.process-list-item:hover { background: #2d2d30; }
.process-list-item.selected { background: #094771; border-left: 3px solid #007acc; }
.process-list-icon { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; display: block; }
.process-list-icon-placeholder { width: 32px; height: 32px; flex-shrink: 0; }
.process-list-info { flex: 1; min-width: 0; }
.process-list-name { font-weight: 400; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Consolas', 'Courier New', monospace; }
.modal-footer { padding: 12px 16px; background: #2d2d30; border-top: 1px solid #3e3e42; display: flex; gap: 8px; justify-content: flex-end; }
.modal-footer button { padding: 8px 20px; border: none; border-radius: 3px; font-size: 12px; font-weight: 600; cursor: pointer; }
.modal-footer .btn-primary { background: #0e639c; color: white; }
.modal-footer .btn-primary:hover { background: #1177bb; }
.modal-footer .btn-secondary { background: #3e3e42; color: #d4d4d4; }
.modal-footer .btn-secondary:hover { background: #4e4e52; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #1e1e1e; }
::-webkit-scrollbar-thumb { background: #3e3e42; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #4e4e52; }

.empty-state { text-align: center; padding: 40px 20px; color: #858585; font-size: 13px; }
</style>
</head>
<body>
<div class="main-container">
<div class="top-bar">
<div class="process-display" id="processDisplay">
<span class="process-icon">📦</span>
<span class="process-name">No process selected</span>
<span class="process-pid"></span>
</div>
<button class="btn-select-process" onclick="openProcessModal()">Select Process</button>
</div>
<div class="content">
<section class="panel scan-controls">
<div class="panel-header">Memory Scanner</div>
<div class="panel-content">
<div class="control-group"><label class="control-label">Scan Type</label><select id="scanType"><option value="exact">Exact Value</option><option value="bigger">Bigger than...</option><option value="smaller">Smaller than...</option><option value="between">Value between...</option><option value="unknown">Unknown initial value</option><option value="increased">Increased value</option><option value="decreased">Decreased value</option><option value="changed">Changed value</option><option value="unchanged">Unchanged value</option></select></div>
<div class="control-group" id="valueGroup"><label class="control-label">Value</label><input type="text" id="scanValue" placeholder="Enter value to search" /></div>
<div class="control-group" id="rangeGroup" style="display:none"><label class="control-label">Range</label><div class="input-row"><input type="text" id="rangeMin" placeholder="Min" /><input type="text" id="rangeMax" placeholder="Max" /></div></div>
<div class="control-group"><label class="control-label">Value Type</label><select id="valueType"><option value="i8">Byte</option><option value="i16">2 Bytes</option><option value="i32" selected>4 Bytes</option><option value="i64">8 Bytes</option><option value="f32">Float</option><option value="f64">Double</option><option value="string">String</option><option value="bytes">Array of byte</option></select></div>
<div class="control-group"><button class="btn btn-primary" id="btnFirstScan">First Scan</button></div>
<div class="control-group"><button class="btn btn-primary" id="btnNextScan" disabled>Next Scan</button></div>
<div class="control-group"><button class="btn btn-secondary" id="btnNewScan" disabled>New Scan</button></div>
<div class="control-group" style="margin-top: 24px;"><label class="control-label">Scan Options</label><div style="font-size: 11px; color: #858585; margin-top: 4px;"><label style="display: flex; align-items: center; margin-bottom: 6px; cursor: pointer;"><input type="checkbox" id="optWritable" style="margin-right: 8px;" /><span>Writable memory only</span></label><label style="display: flex; align-items: center; margin-bottom: 6px; cursor: pointer;"><input type="checkbox" id="optFastScan" style="margin-right: 8px;" /><span>Fast scan (aligned)</span></label></div></div>
</div>
</section>
<section class="panel results-panel">
<div class="panel-header">Found Addresses <span id="resultsCount" style="color: #858585; font-weight: normal;"></span></div>
<div class="results-toolbar"><input type="text" id="filterInput" placeholder="Filter addresses or values..." /><button onclick="filterResults()">Filter</button><button onclick="clearFilter()">Clear</button></div>
<div class="panel-content" style="padding: 0;"><table><thead><tr><th style="width: 50px">#</th><th style="width: 140px">Address</th><th>Value</th><th style="width: 100px">Action</th></tr></thead><tbody id="resultsBody"><tr><td colspan="4" class="empty-state">No scan results yet</td></tr></tbody></table></div>
</section>
<section class="panel address-list">
<div class="panel-header">Address List</div>
<div class="panel-content" style="padding: 0;"><table><thead><tr><th style="width: 40px">✓</th><th style="width: 70px">Freeze</th><th>Description</th><th style="width: 140px">Address</th><th style="width: 100px">Type</th><th style="width: 120px">Value</th><th style="width: 100px">Actions</th></tr></thead><tbody id="addressTableBody"><tr><td colspan="7" class="empty-state">No addresses added yet</td></tr></tbody></table></div>
</section>
</div>
</div>
<div class="modal-overlay" id="processModal">
<div class="modal">
<div class="modal-header"><span class="modal-title">Process List</span><button class="modal-close" onclick="closeProcessModal()">×</button></div>
<div class="modal-tabs"><button class="modal-tab active" data-tab="apps">Applications</button><button class="modal-tab" data-tab="all">All Processes</button><button class="modal-tab" data-tab="system">System</button></div>
<div class="modal-search"><input type="text" id="modalSearch" placeholder="Search processes..." /></div>
<div class="modal-content" id="modalProcessList"><div class="empty-state">Loading processes...</div></div>
<div class="modal-footer"><button class="btn-secondary" onclick="closeProcessModal()">Cancel</button><button class="btn-primary" onclick="attachSelectedProcess()" id="btnAttach" disabled>Open</button></div>
</div>
</div>
<div class="status-bar"><span class="status-text" id="statusText">Ready</span><span class="status-version" id="versionText">v0.0.0</span></div>
<script src="app.js"></script>
</body>
</html>
