[package]
name = "inspectra-gui"
version = "0.1.1"
edition = "2021"
authors = ["Nodasys <kevin.gregoire@nodasys.com>"]

[dependencies]
inspectra-core = { path = "../../core" }
tauri = { version = "1.5", features = [ "window-minimize", "window-maximize", "window-unmaximize", "window-close", "window-hide", "window-unminimize", "window-start-dragging", "window-show", "shell-open", "dialog-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
base64 = "0.21"
image = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
