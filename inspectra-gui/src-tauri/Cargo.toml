[package]
name = "inspectra-gui"
version = "0.1.0"
edition = "2021"
authors = ["Nodasys <kevin.gregoire@nodasys.com>"]

[dependencies]
inspectra-core = { path = "../../core" }
tauri = { version = "1.5", features = [ "window-minimize", "window-maximize", "window-unmaximize", "window-close", "window-hide", "window-unminimize", "window-start-dragging", "window-show", "shell-open", "dialog-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
